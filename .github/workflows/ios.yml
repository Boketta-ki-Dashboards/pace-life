name: Pace Life checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core tests (Swift 6)
        run: swift test --package-path Packages/PaceLifeCore
      - name: Project generation is reproducible
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- PaceLife.xcodeproj
      - name: iOS build and UI tests
        run: scripts/test-ios.sh
