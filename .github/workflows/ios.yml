name: Pace Life checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ios:
    name: iOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          uname -m
          xcodebuild -version
          swift --version
      - name: Core tests (Swift 6)
        run: swift test --package-path Packages/PaceLifeCore
      - name: Project generation is reproducible
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- PaceLife.xcodeproj
      - name: Build configuration evidence
        run: |
          xcodebuild -project PaceLife.xcodeproj -scheme PaceLife -sdk iphonesimulator -showBuildSettings > "$RUNNER_TEMP/build-settings.txt"
          grep -E 'ARCHS =|ONLY_ACTIVE_ARCH =|SWIFT_VERSION =' "$RUNNER_TEMP/build-settings.txt"
      - name: iOS simulator build
        id: simulator_build
        run: scripts/test-ios.sh build-for-testing
      - name: iOS UI tests
        run: scripts/test-ios.sh test-without-building
      - name: Export actual simulator screenshots
        if: ${{ !cancelled() && steps.simulator_build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/pace-screenshots"
          for result in /tmp/PaceLife-test-without-building-*.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/pace-screenshots"
            fi
          done
      - name: Release simulator architectures
        if: ${{ !cancelled() && steps.simulator_build.outcome == 'success' }}
        run: >-
          xcodebuild -project PaceLife.xcodeproj -scheme PaceLife
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedDataRelease CODE_SIGNING_ALLOWED=NO build
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/build-settings.txt
            ${{ runner.temp }}/pace-ios-*.log
            /tmp/PaceLife-*.xcresult
            ${{ runner.temp }}/pace-screenshots
